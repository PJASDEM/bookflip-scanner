name: BookFlip Scanner
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run.mjs', 'feed.mjs', 'marketplaces.mjs', 'reference-parsers.mjs', 'rss.mjs', '.github/workflows/bookflip-scan.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: bookflip-scanner
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'PJASDEM/bookflip-scanner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run bounded BookFlip queue
        env:
          BOOKFLIP_SITES_ACCESS: ${{ secrets.BOOKFLIP_SITES_ACCESS }}
        run: node run.mjs
